# PickTime PWA
# 静态应用监听 8050，域名反向代理到 8050

# 安卓浏览器（非 App 内置 WebView）强制进入安卓专属下载页
map $http_user_agent $pt_is_android {
    default 0;
    "~*Android" 1;
}
map $http_user_agent $pt_is_app_ua {
    default 0;
    "~*PickTimeApp" 1;
}
map $cookie_picktime_app $pt_is_app_cookie {
    default 0;
    "~*1" 1;
}
map $arg_app $pt_is_app_param {
    default 0;
    "~*pt9f3a7c21b8e" 1;
}
# 只有"安卓 UA + 无 App UA + 无 App Cookie + 无 App 令牌"才跳转下载页
map "$pt_is_android:$pt_is_app_ua:$pt_is_app_cookie:$pt_is_app_param" $pt_gate_android {
    default 0;
    "1:0:0:0" 1;
}

log_format pt_gate '$remote_addr [$time_local] gate=$pt_gate_android android=$pt_is_android ua_ok=$pt_is_app_ua cookie_ok=$pt_is_app_cookie token_ok=$pt_is_app_param uri=$request_uri "$http_user_agent"';

server {
    listen 8050;
    server_name _;

    root /home/ubuntu/Picktime;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 12m;

    # 短信验证码：转发到本机短信服务（阿里云 Dypnsapi）
    location = /api/send-sms {
        proxy_pass http://127.0.0.1:5002/api/send-sms;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Google 登录：转发到本机认证服务
    location = /auth/google {
        proxy_pass http://127.0.0.1:5002/auth/google;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /auth/google/callback {
        proxy_pass http://127.0.0.1:5002/auth/google/callback;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location = /api/google/session {
        proxy_pass http://127.0.0.1:5002/api/google/session;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # QQ邮箱验证码：转发到本机邮件服务
    location = /api/send-email-code {
        proxy_pass http://127.0.0.1:5002/api/send-email-code;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /api/verify-email-code {
        proxy_pass http://127.0.0.1:5002/api/verify-email-code;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location = /api/verify-sms {
        proxy_pass http://127.0.0.1:5002/api/verify-sms;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 饮食记录（按用户存储到 MySQL）
    location /api/records {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 抠图摆放位置（统计二级页，按用户存储到 MySQL）
    location /api/positions {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 账号系统（注册/登录/绑定/密保/找回密码）
    location /api/auth/ {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # API 调用设置（登录状态 + 试用期 + 用户自己的 Qwen Key，加密存储）
    location /api/user/ {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 仅抠图：转发到账号服务（校验登录/试用期，按需注入用户自己的美图密钥）
    location = /api/cutout {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        # 老版本客户端（未登录直接调本机抠图）兼容：401 时回退本机 U2NET
        proxy_intercept_errors on;
        error_page 401 = @cutout_legacy;
    }

    location @cutout_legacy {
        rewrite ^ /remove-bg break;
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # 本机 U2NET 抠图（前端兜底用，Purse 共用微服务）
    location = /api/cutout-local {
        proxy_pass http://127.0.0.1:5001/remove-bg;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }



    # 添加页 AI 对话（流式，禁止缓冲）
    location = /api/ai-chat {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 首页抠图小贴士：转发到识别服务（看图片生成一句 AI 提示）
    location = /api/food-tip {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 食物热量识别：转发到本机识别流程服务（Qwen-VL+YOLO26+SAM2+DepthV2+营养库）
    location = /api/recognize {
        proxy_pass http://127.0.0.1:5002/api/recognize;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 抠图进度：转发到识别服务（前端轮询阶段文案）
    location = /api/progress {
        proxy_pass http://127.0.0.1:5003/api/progress;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location = /api/recognize/health {
        proxy_pass http://127.0.0.1:5003/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 食物名称多语言翻译：转发到识别服务（带缓存）
    location = /api/translate {
        proxy_pass http://127.0.0.1:5003/api/translate;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /index.html {
        access_log /var/log/nginx/picktime_gate.log pt_gate;
        if ($pt_gate_android) { rewrite ^ /android/index.html last; }
        add_header Cache-Control "no-cache" always;
    }

    # 根路径：安卓浏览器强制跳转下载页
    location = / {
        access_log /var/log/nginx/picktime_gate.log pt_gate;
        if ($pt_gate_android) { rewrite ^ /android/index.html last; }
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # 安卓专属下载页（自身不被 UA 跳转影响）
    location ^~ /android/ {
        add_header Cache-Control "no-cache" always;
    }

    # APK 安装包与版本信息
    location ^~ /download/ {
        types {
            application/vnd.android.package-archive apk;
            application/json json;
        }
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* \.(png|ico|svg|webp|jpg|jpeg|gif|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    server_name picktime.store www.picktime.store;
    client_max_body_size 12m;




    # 添加页 AI 对话（流式，禁止缓冲）
    location = /api/ai-chat {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/picktime.store/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/picktime.store/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = picktime.store) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name picktime.store www.picktime.store;
    return 404; # managed by Certbot


}
